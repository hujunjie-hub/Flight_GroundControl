name: Flight GroundControl 验收问题
description: 登记本地 Windows Release、MAVLink 遥测、测试或安装验收发现的问题
title: "[FGC][S?][COMPONENT] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issues。一个 Issue 对应一个独立根因。事实、推测和待验证假设必须分开。
        不要将 MockLink Host 测试描述为 Flight UDP SIL 或 H723 实机验证。
  - type: dropdown
    id: issue_type
    attributes:
      label: 问题类型
      options:
        - BUG
        - SAFETY
        - TEST_GAP
        - SPEC_DEFECT
        - INTEGRATION
        - BUILD
        - ENVIRONMENT
        - PERFORMANCE
        - ENHANCEMENT
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重级别
      options:
        - S0-CRITICAL
        - S1-HIGH
        - S2-MEDIUM
        - S3-LOW
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 所属模块
      options:
        - MAVLink Dialect / Parser
        - Vehicle Dispatch
        - Flight FirmwarePlugin
        - FlightTelemetryFactGroup
        - QML Diagnostics
        - MockLink / Integration Tests
        - Flight UDP SIL
        - CMake / MSVC Build
        - Windows Installer
        - CI / Release Workflow
        - Documentation / Spec
        - Other
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current status
      options:
        - NEW
        - TRIAGED
        - NEEDS_INFO
        - REPRODUCED
        - IN_PROGRESS
        - FIXED_WAITING_RETEST
        - RETESTING
        - BLOCKED
        - REOPENED
        - VERIFIED
    validations:
      required: true
  - type: input
    id: run_id
    attributes:
      label: RUN_ID
      description: 发现问题的本地运行 ID；没有则填写 NOT_AVAILABLE。
      placeholder: 20261110T093000123Z_abcdef0
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 发现分支和 commit
      placeholder: codex/phase2-fcu-telemetry @ full SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows / MSVC / Qt 环境
      description: Windows x64、MSVC 版本、CMake、Ninja、Qt、GStreamer。
      render: text
    validations:
      required: true
  - type: input
    id: test
    attributes:
      label: 测试名称 / CTest label / CI Run
      placeholder: FlightTelemetryDispatchTest / Integration / GitHub Actions run URL
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题现象和影响
      description: 说明实际现象、影响范围和是否阻断当前验收。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 给出前置条件、命令、输入帧/数据和可复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 期望结果与实际结果
      description: 分开描述 expected 和 actual。
    validations:
      required: true
  - type: textarea
    id: root_cause
    attributes:
      label: 根因分析
      description: 未确认时写“待定位”；区分事实、推测和待验证假设。
  - type: textarea
    id: evidence
    attributes:
      label: 日志、报告和证据 SHA-256
      description: 写明文件名、路径、哈希和 ZIP 位置；不要只贴截图。
      render: text
    validations:
      required: true
  - type: textarea
    id: fix_regression
    attributes:
      label: 修复 commit 和回归证据
      description: 修复前可留空；修复后必须补充 commit、回归 RUN_ID 和结果。
  - type: checkboxes
    id: safety
    attributes:
      label: 安全边界确认
      options:
        - label: 已检查是否可能造成遥测错误健康显示、权限混淆或错误安全认知
          required: true
        - label: 未将 GCS 遥测显示当作 ARM / FMS / Permit / 执行器授权
          required: true

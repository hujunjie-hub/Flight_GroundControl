name: Windows

on:
  push:
    branches:
      - master
      - 'Stable*'
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read
  actions: read

env:
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@8d961e61720b3c06583517fbc68d57ec0a4e9f95'

jobs:
  changes:
    uses: ./.github/workflows/_detect-changes.yml
    with:
      platform: windows

  build:
    name: Windows x64 MSVC ${{ matrix.build_type }}
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ${{ github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('runs-on={0}/runner=windows-x64-builder', github.run_id) || 'windows-2022' }}
    timeout-minutes: 180

    permissions:
      contents: read
      actions: read
      checks: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        build_type: ['Release']

    defaults:
      run:
        shell: cmd

    steps:
      - name: Enable RunsOn magic cache
        if: github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: runs-on/action@v2
        with:
          metrics: cpu,network,memory,disk,io
          show_costs: summary

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false

      - name: Install Visual Studio Build Tools
        if: github.repository_owner == 'mavlink' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/install-dependencies
        with:
          gstreamer: 'false'
          msvc: 'true'
          nsis: 'true'

      - name: Build Setup
        uses: ./.github/actions/build-setup
        with:
          qt-host: windows
          qt-arch: win64_msvc2022_64
          aqt-source: ${{ env.AQT_SOURCE }}
          build-type: ${{ matrix.build_type }}

      - name: Configure
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}
          testing: 'true'
          extra-args: -DQGC_ENABLE_GST_VIDEOSTREAMING=ON

      - name: Resolve GStreamer root
        id: gst-root
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/cmake_helper.py" cache-var \
            --build-dir "${RUNNER_TEMP}/build" \
            --name GStreamer_ROOT_DIR \
            --required \
            --output-key gst_root

      - name: Add GStreamer to PATH
        shell: bash
        run: echo "${STEPS_GST_ROOT_OUTPUTS_GST_ROOT}/bin" >> "$GITHUB_PATH"
        env:
          STEPS_GST_ROOT_OUTPUTS_GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}

      - name: Build
        id: build
        uses: ./.github/actions/cmake-build
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: ${{ matrix.build_type }}

      - name: Run Unit Tests (parallel)
        id: unit_tests
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          junit-output: junit-results-windows-unit.xml
          ctest-output: test-output-windows-unit.txt
          include-labels: 'Unit'
          exclude-labels: 'Flaky|Network'
          parallel: 'auto'

      - name: Run Integration Tests (serial)
        id: integration_tests
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        uses: ./.github/actions/run-unit-tests
        with:
          build-dir: ${{ runner.temp }}/build
          junit-output: junit-results-windows-integration.xml
          ctest-output: test-output-windows-integration.txt
          include-labels: 'Integration'
          exclude-labels: 'Flaky|Network'
          parallel: '1'

      - name: Report Test Results (unit)
        if: always() && !cancelled() && steps.unit_tests.conclusion != 'skipped'
        uses: ./.github/actions/test-report
        with:
          name: Windows x64 Unit Tests
          build-dir: ${{ runner.temp }}/build
          junit-file: junit-results-windows-unit.xml
          output-file: test-output-windows-unit.txt
          artifact-name: test-results-windows-unit
          retention-days: 7

      - name: Report Test Results (integration)
        if: always() && !cancelled() && steps.integration_tests.conclusion != 'skipped'
        uses: ./.github/actions/test-report
        with:
          name: Windows x64 Integration Tests
          build-dir: ${{ runner.temp }}/build
          junit-file: junit-results-windows-integration.xml
          output-file: test-output-windows-integration.txt
          artifact-name: test-results-windows-integration
          retention-days: 7

      - name: Verify Executable
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/${{ matrix.build_type }}/QGroundControl.exe
          type: exe
          build-dir: ${{ runner.temp }}/build

      - name: Create Installer
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}\\build
          build-type: ${{ matrix.build_type }}

      - name: Install and verify installer
        if: matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $buildDir = "${{ runner.temp }}\\build"
          $installerExe = Get-ChildItem -Path $buildDir -Filter "*installer*.exe" | Select-Object -First 1
          if (-not $installerExe) {
            Write-Error "Installer .exe not found in $buildDir"
            exit 1
          }
          $installDir = "${{ runner.temp }}\\qgc-install-test"
          Write-Host "Installing $($installerExe.Name) to $installDir"
          Start-Process -FilePath $installerExe.FullName -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow
          $binary = Join-Path $installDir "bin\\QGroundControl.exe"
          if (-not (Test-Path $binary)) {
            Write-Error "QGroundControl.exe not found at $binary after install"
            Get-ChildItem -Path $installDir -Recurse | Select-Object FullName
            exit 1
          }
          $pluginDir = Join-Path $installDir "lib\\gstreamer-1.0"
          if (-not (Test-Path $pluginDir)) {
            Write-Error "GStreamer plugin directory not found: $pluginDir"
            exit 1
          }
          $pluginCount = (Get-ChildItem -Path $pluginDir -Filter "*.dll" | Measure-Object).Count
          Write-Host "GStreamer plugins found: $pluginCount"
          if ($pluginCount -eq 0) {
            Write-Error "No GStreamer plugin DLLs found in $pluginDir"
            exit 1
          }

      - name: Remove build SDK from PATH for installed verification
        if: matrix.build_type == 'Release'
        shell: pwsh
        env:
          GST_ROOT: ${{ steps.gst-root.outputs.gst_root }}
        run: |
          $sdkBin = Join-Path $env:GST_ROOT "bin"
          $sanitizedPath = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -ne $sdkBin) }) -join ';'
          "QGC_VERIFY_INSTALLED_PATH=$sanitizedPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed executable
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/verify-executable
        env:
          PATH: ${{ env.QGC_VERIFY_INSTALLED_PATH || env.PATH }}
        with:
          binary-path: ${{ runner.temp }}\\qgc-install-test\\bin\\QGroundControl.exe
          type: exe

      - name: Attest and Upload
        if: matrix.build_type == 'Release'
        uses: ./.github/actions/attest-and-upload
        with:
          artifact-name: QGroundControl-installer-AMD64.exe
          package-name: QGroundControl-installer-AMD64
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-distribution-id: ${{ secrets.AWS_DISTRIBUTION_ID }}

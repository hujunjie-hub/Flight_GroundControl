name: Linux (disabled)

on:
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN: this workflow only checks out nothing and echoes a
# notice, so no write scopes are needed (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  linux-build:
    name: Linux x64 build disabled
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Explain disabled target
        run: echo "Linux x64 product build, tests, and AppImage packaging are disabled. Windows x64 MSVC 2022 Release is the only active platform validation target."

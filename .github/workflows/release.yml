name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release: ${{ steps.release.outputs.new_release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./tools/release.py --install
          rm -f .release-version
          ./tools/release.py --run
          if [[ -f .release-version ]]; then
            version=$(tr -d '[:space:]' < .release-version)
            if [[ -z "${version}" ]]; then
              echo "::error::semantic-release wrote an empty version file"
              exit 1
            fi
            echo "new_release=true" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
            echo "New release: v${version}"
          else
            echo "new_release=false" >> "${GITHUB_OUTPUT}"
            echo "No new release"
          fi

  wait-for-builds:
    name: Wait for Windows x64 Build
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
    steps:
      - name: Wait for Windows x64 build
        uses: int128/wait-for-workflows-action@v1
        with:
          workflow-names: |
            Windows
          timeout-minutes: 170
          poll-interval-minutes: 5

  upload-artifacts:
    name: Upload Windows x64 Release Artifacts
    needs: [semantic-release, wait-for-builds]
    if: needs.semantic-release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve successful platform build run IDs
        id: build-runs
        uses: actions/github-script@v9
        env:
          TAG_NAME: v${{ needs.semantic-release.outputs.version }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'windows.yml', event: 'push', per_page: 100
            });
            const successful = runs
              .filter(run => run.status === 'completed' && run.conclusion === 'success' && run.head_branch === tag)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (successful.length === 0) throw new Error(`No successful Windows x64 build found for ${tag}`);
            core.setOutput('windows_run_id', String(successful[0].id));
      - name: Download Windows x64 installer artifact
        uses: actions/download-artifact@v8
        with:
          name: QGroundControl-installer-AMD64
          run-id: ${{ steps.build-runs.outputs.windows_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/windows
      - name: List artifacts
        run: find artifacts -type f | head -50 || echo "No artifacts found"
      - name: Resolve Windows x64 artifact path
        id: paths
        shell: bash
        run: |
          python3 "${GITHUB_WORKSPACE}/.github/scripts/find_artifact.py" \
            --build-dir artifacts \
            --match "exe=QGroundControl-installer-AMD64*.exe" \
      - name: Generate source SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          artifact-name: sbom-source-spdx
      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.cdx.json
          artifact-name: sbom-source-cyclonedx
      - name: Attest Windows x64 EXE
        id: attest-windows
        if: steps.paths.outputs.exe != ''
        uses: ./.github/actions/attest-sbom
        with:
          subject-path: ${{ steps.paths.outputs.exe }}
          subject-name: windows-x64-exe
        continue-on-error: true
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.semantic-release.outputs.version }}
          files: |
            artifacts/**/*.exe
            sbom-source.spdx.json
            sbom-source.cdx.json
            ${{ steps.attest-windows.outputs.sbom-path }}
          fail_on_unmatched_files: false

name: Detect Changes
on:
  workflow_call:
    inputs:
      platform:
        description: 'Build platform (windows only)'
        required: true
        type: string
    outputs:
      should_build:
        description: 'Whether Windows x64 build should run'
        value: ${{ jobs.detect.outputs.should_build }}
      windows:
        description: 'Whether Windows-relevant files changed'
        value: ${{ jobs.detect.outputs.windows }}
permissions:
  contents: read
jobs:
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.nonpr.outputs.should_build || steps.pr.outputs.should_build }}
      windows: ${{ steps.nonpr.outputs.windows || steps.pr.outputs.windows }}
    steps:
      - name: Checkout passthrough script (non-PR)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/detect_changes.py
            .github/scripts/ci_bootstrap.py
            tools/_bootstrap.py
            tools/common/__init__.py
            tools/common/file_traversal.py
            tools/common/gh_actions.py
            tools/common/git.py
            tools/common/proc.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Emit outputs (non-PR)
        if: github.event_name != 'pull_request'
        id: nonpr
        shell: bash
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/detect_changes.py" --non-pr-passthrough
      - name: Harden Runner
        if: github.event_name == 'pull_request'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout repo
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Detect changes
        if: github.event_name == 'pull_request'
        id: detect
        uses: ./.github/actions/detect-changes
        with:
          platform: windows
      - name: Compute outputs (PR)
        if: github.event_name == 'pull_request'
        id: pr
        shell: bash
        env:
          DETECT_ANY: ${{ steps.detect.outputs.any }}
          DETECT_WINDOWS: ${{ steps.detect.outputs.windows }}
        run: |
          echo "should_build=${DETECT_ANY}" >> "$GITHUB_OUTPUT"
          echo "windows=${DETECT_WINDOWS}" >> "$GITHUB_OUTPUT"

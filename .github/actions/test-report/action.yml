name: Test Report
description: Publish and upload test results; tolerate absent optional JUnit XML while retaining raw CTest logs.

inputs:
  name:
    description: Test report name
    required: true
  build-dir:
    description: Build directory path
    required: true
  junit-file:
    description: JUnit XML file name (relative to build-dir)
    required: false
    default: junit-results.xml
  output-file:
    description: Test output file name (relative to build-dir)
    required: false
    default: test-output.txt
  artifact-name:
    description: Artifact name for uploaded results
    required: true
  retention-days:
    description: Days to retain artifacts
    required: false
    default: "14"

runs:
  using: composite
  steps:
    - name: Check for JUnit report
      id: junit
      if: always()
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        JUNIT_FILE: ${{ inputs.junit-file }}
      run: |
        if [[ -s "${BUILD_DIR}/${JUNIT_FILE}" ]]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::JUnit report missing; raw CTest output will be uploaded."
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish Test Results
      if: always() && steps.junit.outputs.exists == 'true'
      uses: dorny/test-reporter@v3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.build-dir }}/${{ inputs.junit-file }}
        reporter: java-junit
        path-replace-backslashes: true
        fail-on-error: false

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.build-dir }}/${{ inputs.output-file }}
          ${{ inputs.build-dir }}/${{ inputs.junit-file }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

name: Detect Changes
description: Detect source, test, and CI changes for the Windows x64 build

inputs:
  platform:
    description: "Build platform (windows only)"
    required: true

outputs:
  any:
    description: "Whether Windows x64 build inputs changed"
    value: ${{ steps.check.outputs.any }}
  windows:
    description: "Whether Windows x64 build inputs changed"
    value: ${{ steps.check.outputs.windows }}

runs:
  using: composite
  steps:
    - name: Check for changes
      id: check
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
        CURRENT_SHA: ${{ github.sha }}
        INPUTS_PLATFORM: ${{ inputs.platform }}
      run: python3 "${GITHUB_WORKSPACE}/.github/scripts/detect_changes.py" --platform "${INPUTS_PLATFORM}"
